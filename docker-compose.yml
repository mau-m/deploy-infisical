services:
  postgres:
    container_name: postgres_infisical
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_infisical:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infisical_net

  redis:
    container_name: redis_infisical
    image: redis:8.0
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - infisical_net

  infisical:
    container_name: infisical
    image: infisical/infisical:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=${DB_SSLMODE}
      REDIS_URL: redis://redis:6379
      SITE_URL: ${SITE_URL}
      PORT: 8080
      #Token Lifetimes
      JWT_AUTH_LIFETIME: ${JWT_AUTH_LIFETIME}
      JWT_REFRESH_LIFETIME: ${JWT_REFRESH_LIFETIME}
      JWT_SERVICE_LIFETIME: ${JWT_SERVICE_LIFETIME}
      #Network Security
      HTTPS_ENABLED: true
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOW_INTERNAL_IP: false
      TELEMETRY_ENABLED: false
    ports:
      - "8080:8080"
    # read_only: true  # Temporarily disabled for debugging
    # tmpfs:
    #   - /tmp:rw,exec,size=1g
    #   - /etc/ssl:rw,size=100m
    #   - /usr/local/share/ca-certificates:rw,size=50m
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 0.5
    networks:
      - infisical_net

volumes:
  postgres_infisical:

networks:
  infisical_net:
    driver: bridge
